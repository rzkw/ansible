---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-pip
      - pipx
      - nodejs
      - npm
      - tmux
      - wget
      - ufw
      - fail2ban
    state: present

- name: Add github cli gpg key
  ansible.builtin.apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present

- name: Add github cli repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present

- name: Install gh cli
  ansible.builtin.apt:
    name: gh
    state: present

- name: Install oci cli via pipx
  community.general.pipx:
    name: oci-cli
    state: present
  become_user: ubuntu
  become: true

- name: Add hashicorp gpg key
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    state: present

- name: Add hashicorp repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present

- name: Install terraform
  ansible.builtin.apt:
    name: terraform
    state: present

- name: Add tailscale gpg key
  ansible.builtin.apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    state: present

- name: Add tailscale repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Connect to tailscale
  ansible.builtin.command:
    cmd: tailscale up --ssh --authkey {{ tailscale_auth_key }}
  changed_when: false
  when: tailscale_auth_key | default("", true) | length > 0

- name: Install opencode via npm globally
  community.general.npm:
    name: "@opencode/cli"
    global: true
    state: present

- name: Create OCI config directory
  ansible.builtin.file:
    path: /home/ubuntu/.oci
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Write OCI CLI config
  ansible.builtin.copy:
    content: "{{ oci_config }}"
    dest: /home/ubuntu/.oci/config
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Write OCI CLI key
  ansible.builtin.copy:
    content: "{{ oci_key }}"
    dest: /home/ubuntu/.oci/oci_key.pem
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Write OCI CLI rc
  ansible.builtin.copy:
    content: "{{ oci_cli_rc }}"
    dest: /home/ubuntu/.oci/oci_cli_rc
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Create OpenCode config directory
  ansible.builtin.file:
    path: /home/ubuntu/.config/opencode
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Write OpenCode config
  ansible.builtin.copy:
    content: "{{ opencode_config }}"
    dest: /home/ubuntu/.config/opencode/opencode.jsonc
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Docker rootless setup
  ansible.builtin.include_role:
    name: docker_rootless
  vars:
    service_user: ubuntu  # noqa: var-naming[no-role-prefix]
