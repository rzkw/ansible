---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-pip
      - pipx
      - nodejs
      - npm
      - tmux
      - wget
      - ufw
      - fail2ban
    state: present

- name: Add github cli gpg key
  ansible.builtin.apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present

- name: Add github cli repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present

- name: Install gh cli
  ansible.builtin.apt:
    name: gh
    state: present

- name: Install oci cli via pipx
  community.general.pipx:
    name: oci-cli
    state: present
  become_user: ubuntu
  become: true

- name: Add hashicorp gpg key
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    state: present

- name: Add hashicorp repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present

- name: Install terraform
  ansible.builtin.apt:
    name: terraform
    state: present

- name: Add tailscale gpg key
  ansible.builtin.apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    state: present

- name: Add tailscale repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main"
    state: present

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Read tailscale auth key from OCI metadata
  ansible.builtin.uri:
    url: http://169.254.169.254/opc/v1/instance/metadata/tailscale_auth_key
    return_content: true
  register: ts_meta
  # ponytail: only works on OCI instances, fails gracefully elsewhere
  ignore_errors: true

- name: Connect to tailscale
  ansible.builtin.command:
    cmd: tailscale up --ssh --authkey {{ ts_meta.content }}
  when: ts_meta.content | default("", true) | length > 0

- name: Install opencode via npm globally
  community.general.npm:
    name: "@opencode/cli"
    global: true
    state: present

- name: Import OCI CLI config
  ansible.builtin.copy:
    src: "{{ oci_config_dir }}/"
    dest: /home/ubuntu/.oci/
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  when: oci_config_dir | length > 0

- name: Import OpenCode config
  ansible.builtin.copy:
    src: "{{ opencode_config_dir }}/"
    dest: /home/ubuntu/.config/opencode/
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  when: opencode_config_dir | length > 0

- name: Docker rootless setup
  ansible.builtin.include_role:
    name: docker_rootless
  vars:
    service_user: ubuntu  # noqa: var-naming[no-role-prefix]
