---

# Create user, group, enable linger

- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    shell: /bin/bash
    state: present

- name: Create docker group
  group:
    name: "docker"
    shell: /bin/bash
    state: present

- name: Enable linger for service user
  command: "loginctl enable-linger {{ service_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ service_user }}"

# Add Docker's GPG key, add repo, install packages

- name: Install ca-certificates and curl
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  ansible.builtin.get_url: 
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: 'a+r'

- name: Add Docker repo to apt sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: jammy
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Update apt cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true

# Install Docker Engine packages and uidmap for rootless

- name: Install Docker Engine packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - uidmap
    state: present
    update_cache: true

- name: Run Rootless install script
  ansible.builtin.become: true
  ansible.builtin.become_user: "{{ service_user }}"
  ansible.builtin.command: 
    cmd: "dockerd-rootless.setuptool.sh install"
    creates: "/home/{{ service_user }}/.local/share/docker"

- name: Configure env variables in .bashrc
  ansible.builtin.become: true
  ansible.builtin.become_user: "{{ service_user }}"
  ansible.builtin.blockinfile:
    path: "/home/{{ service_user }}/.bashrc"
    marker: "# Ansible managed block Docker rootless"
    block: |
      export PATH=/usr/bin:$PATH
      export DOCKER_HOST=unix:///run/user/{{ service_user }}/docker.sock

  
